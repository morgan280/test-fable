name: Fetch and optimize gallery images

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-gallery.yml
      - assets/gallery-src/**

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-gallery
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build gallery WebPs (user files first, stand-ins otherwise)
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
          mkdir -p assets/gallery
          mapfile -t SRC < <(find assets/gallery-src -maxdepth 1 -type f \
            \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) \
            ! -iname 'portrait-*' ! -iname 'weld-*' ! -iname 'difference-*' | sort -f)
          process() { # $1 input, $2 slot number
            convert "$1" -auto-orient -resize 1600x -strip "/tmp/f.png"
            convert "$1" -auto-orient -resize 560x  -strip "/tmp/t.png"
            cwebp -quiet -q 80 /tmp/f.png -o "assets/gallery/$2.webp"
            cwebp -quiet -q 76 /tmp/t.png -o "assets/gallery/$2-thumb.webp"
          }
          if [ ${#SRC[@]} -gt 0 ]; then
            echo "using ${#SRC[@]} owner-provided files from assets/gallery-src/"
            n=1
            for f in "${SRC[@]}"; do
              [ $n -le 6 ] || break
              echo "slot $n <- $f"
              process "$f" "$n"
              n=$((n+1))
            done
          else
            echo "no owner files yet — using AI stand-ins"
            BASE="https://krayawn-mcp.delicate-star-fc13.workers.dev/media"
            declare -A IMAGES=(
              [1]="img_934e5abaa90f4395b5e2"
              [2]="img_4e696875b7e448bf8502"
              [3]="img_a387d984de7842e9b869"
              [4]="img_6eac94e9a1cd4fd399a5"
              [5]="img_0b9ffa6790b242198ce7"
            )
            for n in 1 2 3 4 5; do
              curl -sL --max-time 60 "$BASE/${IMAGES[$n]}" -o "/tmp/$n.src"
              file -b --mime-type "/tmp/$n.src" | grep -q '^image/' || { echo "bad download"; exit 1; }
              process "/tmp/$n.src" "$n"
            done
            rm -f assets/gallery/6.webp assets/gallery/6-thumb.webp
          fi
          ls -la assets/gallery/

      - name: Build craft-section images (portrait-* / weld-* drop-ins)
        run: |
          set -e
          shopt -s nullglob nocaseglob
          craft() { # $1 source, $2 output basename, $3 max width
            convert "$1" -auto-orient -resize "$3"x -strip /tmp/c.png
            cwebp -quiet -q 82 /tmp/c.png -o "assets/img/$2.webp"
            echo "built assets/img/$2.webp from $1"
          }
          P=(assets/gallery-src/portrait-*)
          W=(assets/gallery-src/weld-*)
          [ ${#P[@]} -gt 0 ] && craft "${P[0]}" craft-portrait 1400
          [ ${#W[@]} -gt 0 ] && craft "${W[0]}" craft-weld 1600
          true

      - name: Commit gallery assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gallery assets/img
          git commit -m "Rebuild optimized gallery images" || echo "no changes"
          git push

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "$GITHUB_REF_NAME"
